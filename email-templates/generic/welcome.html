<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Welcome to Potent Hygiene</title>
  </head>
  <body
    style="
      margin: 0;
      padding: 0;
      background-color: #ffffff;
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    "
  >
    <center>
      <div
        style="
          max-width: 560px;
          margin: 0 auto;
          padding: 28px 20px;
          text-align: left;
          color: #444;
        "
      >
        <h1 style="text-align: center; color: #1b7f85; margin: 0 0 8px">
          Potent
        </h1>
        <h2 style="text-align: center; color: #222; font-size: 18px">
          Welcome to Potent Hygiene
        </h2>
        <p>Hello {{name}},</p>
        <p>
          Your Potent Hygiene account is ready. You can now explore your
          dashboard, track orders, and shop products made for everyday comfort.
        </p>
        <p>
          <a
            href="{{baseUrl}}"
            style="
              display: inline-block;
              margin-top: 12px;
              padding: 12px 18px;
              background-color: #1b7f85;
              color: #ffffff;
              text-decoration: none;
              border-radius: 6px;
            "
            >Visit Potent Hygiene</a
          >
        </p>
        <p style="margin-top: 28px">Team Potent Hygiene</p>
      </div>
    </center>
  </body>
</html>
